# 수동 실행 전용.
#
# 평소 수집은 로컬 크론(daily.sh)이 한다. 키를 GitHub 에 올리지 않기 위해서다.
# 이 워크플로를 쓰려면 Settings → Secrets and variables → Actions 에
# DART_API_KEY 를 등록해야 한다. 등록 전에는 실행해도 첫 단계에서 멈춘다.

name: 일정 수집 (수동)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 키 없이 수집하면 공시 일정이 통째로 빠진 events.json 이 만들어진다.
      # 그대로 커밋하면 이미 모아 둔 수백 건이 사라지므로 먼저 막는다.
      - name: 키 확인
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          if [ -z "$DART_API_KEY" ]; then
            echo "::error::DART_API_KEY 시크릿이 없습니다. 평소 수집은 로컬 daily.sh 가 합니다."
            exit 1
          fi

      - name: 규칙 점검
        run: python3 collect_dart.py --selftest

      - name: 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python3 collect_dart.py --days 180 --inject index.html --brief 14

      # 수집이 반쯤 실패해도 명령은 성공으로 끝난다. 급감했으면 커밋하지 않는다.
      - name: 급감 점검
        run: |
          before=$(git show HEAD:events.json | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
          after=$(python3 -c "import json; print(len(json.load(open('events.json'))))")
          echo "일정 $before → $after"
          if [ "$after" -lt $(( before * 6 / 10 )) ]; then
            echo "::error::일정이 $before → $after 로 급감했습니다. 커밋하지 않습니다."
            exit 1
          fi

      - name: 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json index.html
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "일정 자동 갱신 $(date -u +%Y-%m-%d)"
          git push
