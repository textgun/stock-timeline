# 매일 장 마감 후 DART 를 훑어 일정을 갱신하고 GitHub Pages 에 올린다

name: 일정 수집

on:
  schedule:
    - cron: "0 10 * * 1-5"      # UTC 10:00 = KST 19:00, 평일
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 분류 규칙이 깨진 채로 커밋되는 것을 막는다
      - name: 규칙 점검
        run: python3 collect_dart.py --selftest

      - name: 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python3 collect_dart.py --days 180 --inject index.html --brief 14

      - name: 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json index.html
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "일정 자동 갱신 $(date -u +%Y-%m-%d)"
          git push
