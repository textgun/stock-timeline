<title>바이오·IR 일정 타임라인</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
  :root{
    --ground:#F4F3F1;
    --surface:#FFFFFF;
    --surface-2:#FAF9F7;
    --ink:#1A1517;
    --ink-2:#4A4348;
    --muted:#7B7379;
    --line:#E2DEDC;
    --line-strong:#CFC9C6;
    --today:#D6284B;
    --shade:rgba(26,21,23,.030);

    --c-conf:#15697F;
    --c-partner:#6B4FBB;
    --c-ir:#C2334D;
    --c-cap:#8C5A2B;
    --c-disc:#A96A08;
    --c-market:#3B7A55;
    --c-macro:#1F5A8F;

    --urgent:#D6284B;
    --soon:#B07407;
    --past:#8A8288;

    --radius:6px;
    --lane-w:132px;
    --font-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    --font-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#141114;
      --surface:#1C181B;
      --surface-2:#221D21;
      --ink:#EFEAEC;
      --ink-2:#C2B9BE;
      --muted:#8E848A;
      --line:#2E272C;
      --line-strong:#413941;
      --today:#FF5E7A;
      --shade:rgba(255,255,255,.028);

      --c-conf:#4FB6CE;
      --c-partner:#A48CF0;
      --c-ir:#F4788D;
      --c-cap:#D9A06B;
      --c-disc:#E0A845;
      --c-market:#68B884;
      --c-macro:#6BA3D6;

      --urgent:#FF5E7A;
      --soon:#E0A845;
      --past:#6E656B;
    }
  }
  :root[data-theme="dark"]{
    --ground:#141114;
    --surface:#1C181B;
    --surface-2:#221D21;
    --ink:#EFEAEC;
    --ink-2:#C2B9BE;
    --muted:#8E848A;
    --line:#2E272C;
    --line-strong:#413941;
    --today:#FF5E7A;
    --shade:rgba(255,255,255,.028);

    --c-conf:#4FB6CE;
    --c-partner:#A48CF0;
    --c-ir:#F4788D;
    --c-cap:#D9A06B;
    --c-disc:#E0A845;
    --c-market:#68B884;
    --c-macro:#6BA3D6;

    --urgent:#FF5E7A;
    --soon:#E0A845;
    --past:#6E656B;
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:var(--font-ui);
    font-size:14px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--today);outline-offset:2px;border-radius:3px}

  .wrap{max-width:1440px;margin:0 auto;padding:22px 20px 40px;display:flex;flex-direction:column;gap:16px}

  /* ---------- header ---------- */
  header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;
    border-bottom:1px solid var(--line);padding-bottom:14px}
  .brand h1{margin:0;font-size:21px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
  .brand p{margin:4px 0 0;color:var(--muted);font-size:12.5px}
  .clock{text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums}
  .clock .d{font-size:20px;font-weight:600;letter-spacing:-.02em}
  .clock .l{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

  /* ---------- toolbar ---------- */
  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .chip{
    border:1px solid var(--line-strong);background:var(--surface);
    padding:5px 11px 5px 9px;border-radius:100px;font-size:12.5px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;transition:background .12s,border-color .12s;
  }
  .chip .sw{width:9px;height:9px;border-radius:2px;background:var(--dot,var(--muted))}
  .chip[aria-pressed="false"]{opacity:.42}
  .chip:hover{border-color:var(--ink-2)}
  .chip .n{font-family:var(--font-num);font-size:11px;color:var(--muted)}
  .spacer{flex:1 1 auto}
  input[type="search"]{
    font-family:inherit;font-size:13px;padding:6px 11px;border-radius:100px;
    border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);width:170px;
  }
  input[type="search"]::placeholder{color:var(--muted)}
  .btn{
    border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--radius);
    padding:5px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap;
  }
  .btn:hover{border-color:var(--ink-2)}
  .btn.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}
  .seg{display:inline-flex;align-items:center;gap:0}
  .seg .seglbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:7px}
  .seg .btn:first-of-type{border-radius:var(--radius) 0 0 var(--radius)}
  .seg .btn:last-of-type{border-radius:0 var(--radius) var(--radius) 0;margin-left:-1px}
  select.btn{padding:5px 8px}
  .zoom{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);
    background:var(--surface);border-radius:100px;padding:3px 10px}
  .zoom button{border:0;background:none;cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;color:var(--ink-2)}
  .zoom input[type="range"]{width:110px;accent-color:var(--c-conf)}
  .zoom .lvl{font-family:var(--font-num);font-size:11px;color:var(--muted);min-width:52px;text-align:right}

  /* ---------- main grid ---------- */
  .cols{display:grid;grid-template-columns:246px minmax(0,1fr);gap:16px;align-items:start}
  @media (max-width:900px){.cols{grid-template-columns:1fr}}

  /* ---------- D-day rail ---------- */
  .rail{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .rail h2{margin:0;padding:11px 13px 9px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);border-bottom:1px solid var(--line);font-weight:600}
  .rail .list{max-height:560px;overflow-y:auto}
  .rcard{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:10px 13px;
    border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;
    width:100%;text-align:left}
  .rcard:hover{background:var(--surface-2)}
  .rcard .dd{font-family:var(--font-num);font-weight:600;font-size:15px;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;padding-top:1px}
  .rcard .dd.u{color:var(--urgent)}
  .rcard .dd.s{color:var(--soon)}
  .rcard .dd.n{color:var(--muted)}
  .rcard .t{display:block;font-size:13px;font-weight:500;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .rcard .m{display:block;font-size:11px;color:var(--muted);font-family:var(--font-num);margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rail .empty{padding:22px 13px;color:var(--muted);font-size:12.5px}

  /* ---------- timeline ---------- */
  .board{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .board-inner{display:grid;grid-template-columns:var(--lane-w) minmax(0,1fr)}
  .lanes{border-right:1px solid var(--line);background:var(--surface-2)}
  .lanes .hd{height:46px;border-bottom:1px solid var(--line)}
  .lane-label{display:flex;align-items:center;gap:7px;padding:0 12px;border-bottom:1px solid var(--line);
    font-size:12.5px;font-weight:500}
  .lane-label .sw{width:3px;height:16px;border-radius:2px;background:var(--dot);flex:0 0 auto}
  .lane-label .nm{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lane-label .cnt{font-family:var(--font-num);font-size:10.5px;color:var(--muted);flex:0 0 auto}
  .lane-label:last-child{border-bottom:0}

  .scroller{overflow-x:auto;overflow-y:hidden;cursor:grab;position:relative}
  .scroller.drag{cursor:grabbing}
  .canvas{position:relative}
  .axis{height:46px;position:relative;border-bottom:1px solid var(--line);
    background:var(--surface);position:sticky;top:0;z-index:3}
  .yr{position:absolute;top:5px;font-family:var(--font-num);font-size:10.5px;letter-spacing:.12em;
    color:var(--muted);padding-left:6px}
  .mo{position:absolute;top:22px;font-family:var(--font-num);font-size:11.5px;color:var(--ink-2);
    padding-left:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .dy{position:absolute;top:22px;font-family:var(--font-num);font-size:10px;color:var(--muted);
    padding-left:3px;white-space:nowrap}
  .vline{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
  .vline.strong{background:var(--line-strong)}
  .qband{position:absolute;top:0;bottom:0;background:var(--shade);pointer-events:none}
  .lanerow{position:relative;border-bottom:1px solid var(--line)}
  .lanerow:last-child{border-bottom:0}

  .ev{position:absolute;height:22px;border-radius:4px;border:1px solid;cursor:pointer;
    padding:0;font-size:11.5px;white-space:nowrap;overflow:visible;
    background:var(--surface);transition:box-shadow .1s;z-index:1}
  .ev:hover{box-shadow:0 2px 9px rgba(0,0,0,.16);z-index:6}
  .ev .fill{position:absolute;inset:0;border-radius:3px;opacity:.22}
  .ev .lbl{position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:7px;
    color:var(--ink);display:flex;align-items:center;gap:5px;pointer-events:none}
  .ev.inside .lbl{left:0;margin-left:8px}
  .ev .dd{font-family:var(--font-num);font-size:9.5px;font-weight:600;padding:1px 4px;border-radius:3px;
    background:var(--urgent);color:#fff;letter-spacing:-.01em}
  .ev.past{opacity:.42}
  .ev.est{border-style:dashed}
  .ev.est .fill{opacity:.10}
  .ev.sel{box-shadow:0 0 0 2px var(--ink);z-index:7}
  .ev.sel .lbl{font-weight:600}
  .today-line{position:absolute;top:0;bottom:0;width:2px;background:var(--today);z-index:2;pointer-events:none}
  .today-flag{position:absolute;top:2px;transform:translateX(-50%);background:var(--today);color:#fff;
    font-family:var(--font-num);font-size:9.5px;padding:1px 5px;border-radius:3px;z-index:4;pointer-events:none;
    letter-spacing:.06em}

  /* ---------- detail ---------- */
  .detail{position:fixed;right:0;top:0;bottom:0;width:min(390px,92vw);background:var(--surface);
    border-left:1px solid var(--line-strong);box-shadow:-8px 0 30px rgba(0,0,0,.16);
    transform:translateX(102%);transition:transform .22s cubic-bezier(.4,0,.2,1);z-index:50;
    display:flex;flex-direction:column;overflow-y:auto}
  .detail.open{transform:none}
  .detail.flash{box-shadow:-8px 0 30px rgba(0,0,0,.16), inset 3px 0 0 var(--c-macro)}
  @media (prefers-reduced-motion:reduce){.detail{transition:none}}
  .detail .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
    padding:18px 18px 14px;border-bottom:1px solid var(--line)}
  .detail .kicker{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
  .detail h3{margin:6px 0 0;font-size:17px;font-weight:600;line-height:1.35;text-wrap:balance}
  .detail .close{border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1}
  .detail dl{margin:0;padding:16px 18px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:9px 12px;font-size:13px}
  .detail dt{color:var(--muted);font-size:12px}
  .detail dd{margin:0;font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:12.5px}
  .detail dd.kr{font-family:var(--font-ui);font-size:13px}
  .tick{display:inline-block;font-family:var(--font-num);font-size:11.5px;border:1px solid var(--line-strong);
    border-radius:4px;padding:1px 6px;margin:0 4px 4px 0}
  .detail .note{padding:0 18px 18px;color:var(--ink-2);font-size:12.5px;line-height:1.6}
  .srcbtn{display:inline-block;margin:0 18px 20px;font-size:12.5px;color:var(--ink);
    border:1px solid var(--line-strong);border-radius:var(--radius);padding:6px 11px;text-decoration:none}
  .srcbtn:hover{border-color:var(--ink-2)}
  .flag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:3px;border:1px solid var(--line-strong);
    color:var(--muted);margin-left:6px;vertical-align:2px}
  .flag.ed{border-color:var(--c-macro);color:var(--c-macro)}
  .detail .edits{margin:0 18px 14px;padding:10px 12px;border:1px solid var(--line-strong);
    border-radius:var(--radius);background:var(--surface-2);font-size:12px;line-height:1.6}
  .detail .edits b{color:var(--c-macro);font-weight:600}
  .detail .edits s{color:var(--muted)}
  .detail .acts{display:flex;flex-wrap:wrap;gap:8px;margin:0 18px 20px}
  .detail .acts a,.detail .acts button{font-size:12.5px;color:var(--ink);font-family:inherit;
    border:1px solid var(--line-strong);border-radius:var(--radius);padding:6px 11px;
    text-decoration:none;background:var(--surface);cursor:pointer}
  .detail .acts a:hover,.detail .acts button:hover{border-color:var(--ink-2)}
  .detail .eid{font-family:var(--font-num);font-size:11px;color:var(--muted);
    margin:0 18px 10px;word-break:break-all}

  /* ---------- footer note ---------- */
  .foot{color:var(--muted);font-size:12px;line-height:1.7;border-top:1px solid var(--line);padding-top:14px}
  .foot b{color:var(--ink-2);font-weight:600}
  .foot code{font-family:var(--font-num);font-size:11.5px;background:var(--surface-2);padding:1px 5px;border-radius:3px}
  .hint{color:var(--muted);font-size:11.5px;font-family:var(--font-num)}

  /* ---------- 워치리스트 강조 ---------- */
  .ev.watch{border-width:1.5px}
  .ev.watch .fill{opacity:.34}
  .ev.est .fill{opacity:.10}
  .star{color:var(--soon);font-size:10px;letter-spacing:0}

  /* ---------- 연쇄 일정 연결선 ---------- */
  .ev.cluster .cn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-num);font-size:9px;font-weight:600;color:var(--ink);letter-spacing:-.04em}
  .ev.cluster{cursor:zoom-in}
  .chainline{position:absolute;height:1px;background:var(--line-strong);z-index:0;pointer-events:none}
  .chainline::after{content:"";position:absolute;right:0;top:-2px;width:0;height:0;
    border-left:4px solid var(--line-strong);border-top:2.5px solid transparent;border-bottom:2.5px solid transparent}

  /* ---------- 아젠다 뷰 ---------- */
  .agenda{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .agenda .mhead{position:sticky;top:0;z-index:2;background:var(--surface-2);
    border-bottom:1px solid var(--line);border-top:1px solid var(--line);
    padding:8px 14px;font-family:var(--font-num);font-size:11.5px;letter-spacing:.1em;
    color:var(--muted);display:flex;justify-content:space-between}
  .agenda .mhead:first-child{border-top:0}
  .arow{display:grid;grid-template-columns:74px 92px minmax(0,1fr) auto;gap:12px;align-items:baseline;
    padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;
    background:none;border-left:0;border-right:0;border-top:0}
  .arow:hover{background:var(--surface-2)}
  .arow:last-child{border-bottom:0}
  .arow .ad{font-family:var(--font-num);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
  .arow .ad .wd{color:var(--muted);font-size:11px;margin-left:3px}
  .arow .add{font-family:var(--font-num);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
  .arow .add.u{color:var(--urgent)}
  .arow .add.s{color:var(--soon)}
  .arow .add.n{color:var(--muted)}
  .arow .at{font-size:13.5px;line-height:1.4;min-width:0}
  .arow .at .org{color:var(--muted);font-size:11.5px;margin-left:7px;white-space:nowrap}
  .arow .ac{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);white-space:nowrap}
  .arow .ac .sw{width:8px;height:8px;border-radius:2px;background:var(--dot)}
  .arow.past{opacity:.5}
  .arow.today{background:color-mix(in srgb,var(--today) 7%,transparent)}
  .arow .step{font-family:var(--font-num);font-size:10px;color:var(--muted);
    border:1px solid var(--line-strong);border-radius:3px;padding:0 4px;margin-left:6px}
  .agenda .empty{padding:26px 14px;color:var(--muted);font-size:13px}
  @media (max-width:640px){
    .arow{grid-template-columns:66px 60px minmax(0,1fr);gap:9px}
    .arow .ac{display:none}
  }

  /* ---------- 레일 구간 머리 ---------- */
  .rail .sect{padding:7px 13px 5px;font-family:var(--font-num);font-size:10px;letter-spacing:.12em;
    color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line)}
  .rcard.watch .t::before{content:"★ ";color:var(--soon);font-size:11px}

  /* ---------- 상태 줄 ---------- */
  .statline{display:flex;flex-wrap:wrap;gap:14px;align-items:baseline;
    font-family:var(--font-num);font-size:11.5px;color:var(--muted)}
  .statline b{color:var(--ink);font-weight:600;font-size:13px}
  .statline .sep{color:var(--line-strong)}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>바이오·IR 일정 타임라인</h1>
      <p>워치리스트 종목의 DART 공시 일정 · 법정 제출기한 · 글로벌 학회를 한 축 위에서</p>
    </div>
    <div class="clock">
      <div class="d" id="todayTxt">—</div>
      <div class="l">TODAY (KST)</div>
    </div>
  </header>

  <div class="toolbar" id="toolbar">
    <div id="catChips" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    <span class="spacer"></span>
    <div class="seg" id="viewSeg" role="group" aria-label="보기 방식">
      <span class="seglbl">보기</span>
      <button class="btn on" data-v="timeline">타임라인</button>
      <button class="btn" data-v="agenda">아젠다</button>
    </div>
    <div class="seg" id="groupSeg" role="group" aria-label="레인 기준">
      <span class="seglbl">레인</span>
      <button class="btn on" data-g="cat">카테고리별</button>
      <button class="btn" data-g="org">기업별</button>
    </div>
    <select id="sortSel" class="btn" aria-label="기업 정렬" hidden>
      <option value="due">임박순</option>
      <option value="name">이름순</option>
    </select>
    <input type="search" id="q" placeholder="기업·종목코드·일정 검색" aria-label="검색">
    <button class="btn" id="watchOnly" aria-pressed="false" title="워치리스트 종목의 일정만 봅니다">★ 내 종목만</button>
    <button class="btn" id="only30" aria-pressed="false">D-30 이내만</button>
    <button class="btn on" id="hidePast" aria-pressed="true">지난 일정 숨기기</button>
    <div class="zoom" id="zoomBox">
      <button id="zOut" aria-label="축소">−</button>
      <input type="range" id="zRange" min="0" max="100" value="30" aria-label="확대 축소">
      <button id="zIn" aria-label="확대">+</button>
      <span class="lvl" id="zLvl"></span>
    </div>
    <button class="btn" id="goToday">오늘로</button>
    <button class="btn" id="icsBtn" title="지금 보이는 일정을 캘린더 파일로 내려받습니다">캘린더 내보내기</button>
  </div>

  <div class="statline" id="statline"></div>

  <div class="cols">
    <aside class="rail">
      <h2>임박 일정</h2>
      <div class="list" id="rail"></div>
    </aside>

    <div class="agenda" id="agenda" hidden></div>

    <div class="board" id="board">
      <div class="board-inner">
        <div class="lanes" id="lanes"><div class="hd"></div></div>
        <div class="scroller" id="scroller">
          <div class="canvas" id="canvas">
            <div id="bg"></div>
            <div class="axis" id="axis"></div>
            <div id="rows"></div>
          </div>
        </div>
      </div>
    </div>

/* ============================================================
   2. 상태 — 축 범위는 데이터에서 계산한다 (연도를 코드에 박지 않는다)
   ============================================================ */
const DAY = 86400000;
const $ = s => document.querySelector(s);
const parse = s => {const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const days = (a,b) => Math.round((b-a)/DAY);
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmt = d => `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`;
const WD = ['일','월','화','수','목','금','토'];
const today = (()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());})();

const endOf  = ev => parse(ev.end||ev.start);
const dday   = ev => days(today, parse(ev.start));
const isPast = ev => days(today, endOf(ev)) < 0;
/* 이미 시작한 구간은 시작일이 아니라 남은 날로 급한 정도를 잰다.
   진행 중인 자기주식 취득 3개월치가 내일 있는 실적발표를 밀어내면 안 된다. */
const urgency = ev => {const d=dday(ev); return d>=0 ? d : days(today, endOf(ev));};

/* 오늘 기준 -3개월 ~ +15개월 창에 데이터 전체를 합치고 월 경계로 맞춘다 */
const RANGE = (()=>{
  let lo = new Date(today.getFullYear(), today.getMonth()-3, 1);
  let hi = new Date(today.getFullYear(), today.getMonth()+15, 1);
  EVENTS.forEach(e=>{const a=parse(e.start), b=endOf(e); if(a<lo)lo=a; if(b>hi)hi=b;});
  return {s:new Date(lo.getFullYear(),lo.getMonth(),1),
          e:new Date(hi.getFullYear(),hi.getMonth()+1,0)};
})();
const TOTAL  = days(RANGE.s, RANGE.e) + 1;
const MONTHS = (()=>{const out=[];let d=new Date(RANGE.s);
  while(d<=RANGE.e){out.push(d);d=new Date(d.getFullYear(),d.getMonth()+1,1);}return out;})();
const YEARS  = [...new Set(MONTHS.map(d=>d.getFullYear()))];
const x = d => days(RANGE.s, d) * state.ppd;

const state = {
  ppd: 2.6,
  cats: new Set(Object.keys(CATS)),
  group:'cat', sort:'due', view:'timeline',
  q:'', only30:false, hidePast:true, watchOnly:false, sel:null
};

const HAS_WATCH = EVENTS.some(e=>e.watch);
const CHAINS = (()=>{const m={};EVENTS.forEach(e=>{if(e.chain)(m[e.chain]=m[e.chain]||[]).push(e);});return m;})();

/* ============================================================
   3. 필터
   ============================================================ */
function visible(ev){
  if(ev.hidden) return false;                  // overrides.json 에서 숨긴 일정
  if(!state.cats.has(ev.cat)) return false;
  if(state.watchOnly && !ev.watch) return false;
  if(state.hidePast && isPast(ev)) return false;
  if(state.only30){const dd=dday(ev); if(dd<0||dd>30) return false;}
  if(state.q){
    const hay = (ev.title+' '+ev.org+' '+(ev.tickers||[]).join(' ')
                 +' '+(ev.place||'')+' '+(ev.note||'')).toLowerCase();
    if(!hay.includes(state.q.toLowerCase())) return false;
  }
  return true;
}
/* 딱지는 하나만 붙는다. 근거가 추정이면 「예상」, 출처가 미확인이면 「샘플」,
   사람이 손댄 것이면 「수정」·「직접」. 값의 출처를 한 글자로 알리는 자리다. */
const flagOf = ev => ev.estimated      ? '<span class="flag">예상</span>'
                   : ev.verified===false ? '<span class="flag">샘플</span>'
                   : ev.edited         ? '<span class="flag ed">수정</span>'

function buildChips(){

const groupKey = ev => state.group==='cat' ? ev.cat : ev.org;

function groupList(){
  if(state.group==='cat')
    return Object.entries(CATS).map(([k,c])=>({key:k,label:c.label,color:c.color,n:0}));
  const map=new Map();
  EVENTS.filter(visible).forEach(ev=>{
    const k=ev.org, dd=dday(ev);
    const g = map.get(k) || {key:k,label:k,color:CATS[ev.cat].color,next:Infinity,n:0,watch:false};
    if(dd>=0 && dd<g.next) g.next=dd;
    g.watch = g.watch || !!ev.watch;
    g.n++; map.set(k,g);
  });
  const arr=[...map.values()];
  arr.sort(state.sort==='name'
    ? (a,b)=>a.label.localeCompare(b.label,'ko')
    : (a,b)=>(a.next-b.next) || a.label.localeCompare(b.label,'ko'));
  return arr;
}

/* 막대 배치는 막대 기하만으로 정한다.
   라벨 폭까지 넣어 자리를 잡으면 일정이 많아질수록 레인이 수십 줄로 늘어난다.
   라벨은 배치가 끝난 뒤 남는 자리에만 그린다. */
/* 라벨 폭 어림 — 한글·한자는 폰트 크기만큼, 영문·숫자는 그 절반가량 차지한다.
   6.8px 로 뭉뚱그렸다가 한글 제목의 라벨이 서로 겹쳤다. */
const WIDE = /[\u1100-\u11FF\u2E80-\u9FFF\uAC00-\uD7AF\uFF00-\uFF60]/;
const textW = t => {let w=0; for(const c of t) w += WIDE.test(c)?11.5:6.4; return w;};
const labelW = ev => textW(ev.title)*1.06 + (ev.watch?13:0)
                   + (ev.estimated||ev.verified===false?30:0) + 34;
const MAXROWS = 8;          // 레인 하나가 이보다 깊어지면 화면이 읽히지 않는다

/* 왼쪽부터 그리디로 줄을 배정한다.

   라벨까지 들어갈 자리를 먼저 찾고, 어느 줄에도 없으면 라벨을 포기하고
   막대만 놓는다. 라벨 폭을 배치에 넣되 줄 수를 MAXROWS 로 묶어 두는 것이
   핵심이다 — 상한 없이 넣으면 레인이 수십 줄로 늘어나고, 아예 빼면
   세로 공간이 남는데도 라벨이 하나도 안 붙는다.

   막대끼리 겹쳐야만 놓을 수 있었으면 overlapped 를 세워 돌려준다.
   그때는 호출한 쪽이 더 넓게 묶어서 다시 부른다. */
function assign(items){
  const ends=[], bars=[];              // 라벨 포함 오른쪽 끝 / 막대만의 오른쪽 끝
  let overlapped = 0;
  items.forEach(p=>{
    const need = p.group ? 0 : labelW(p.ev);
    const inside = !p.group && p.w > need+8;
    let r = ends.findIndex(e => e <= p.left-6);
    if(r===-1 && ends.length < MAXROWS){ r=ends.length; ends.push(0); bars.push(0); }
    if(r!==-1){
      p.row=r; p.lab = p.group ? 'none' : (inside?'inside':'out');
      bars[r]=p.left+p.w;
      ends[r]=p.left+p.w+(p.lab==='out'?need:0);
      return;
    }
    r = bars.findIndex(e => e <= p.left-4);        // 라벨은 포기하고 막대만
    if(r===-1){ r = bars.indexOf(Math.min(...bars)); overlapped++; }
    p.row=r; p.lab='none';
    bars[r]=Math.max(bars[r], p.left+p.w);
    ends[r]=Math.max(ends[r], p.left+p.w);
  });
  return {rows:Math.max(1,ends.length), overlapped};
}

/* 현재 확대 수준에서 겹칠 수밖에 없는 것들을 한 마커로 묶는다.
   확대하면 묶음이 저절로 풀리므로 정보가 사라지지는 않는다. */
function cluster(items, px){
  const bucket=new Map();
  items.forEach(p=>{
    const k=Math.floor(p.left/px);
    (bucket.get(k) || bucket.set(k,[]).get(k)).push(p);
  });
  const out=[];
  [...bucket.entries()].sort((a,b)=>a[0]-b[0]).forEach(([k,ps])=>{
    const evs = ps.flatMap(p => p.group || [p.ev]);      // 묶음을 다시 묶을 때 속을 잃지 않게
    if(evs.length===1){ out.push({...ps[0], row:0}); return; }
    out.push({left:k*px, w:px-2, lab:'none', row:0, ev:evs[0], group:evs});
  });
  return out;
}

function layout(){
  const out = {groups:[], by:{}};
  groupList().forEach(g=>{
    const list = EVENTS.filter(e=>visible(e) && groupKey(e)===g.key)
      .sort((a,b)=>parse(a.start)-parse(b.start));
    let placed = list.map(ev=>{
      const s=parse(ev.start), e=endOf(ev);
      return {ev, left:x(s), w:Math.max((days(s,e)+1)*state.ppd, 7), row:0, lab:'none'};
    });
    let res = assign(placed);
    for(let px=13; res.overlapped && px<=160; px*=2){    // 묶는 폭을 넓혀가며 다시 시도
      placed = cluster(placed.map(p=>p.group?{...p,w:7}:p), px);
      res = assign(placed);
    }

    if(!list.length) return;            // 빈 레인은 자리만 차지한다
    g.n = list.length;
    out.groups.push(g);
    out.by[g.key] = {rows:res.rows, items:placed};
  });
  return out;
}
const laneH = n => n*30 + 12;

function buildAxis(){
  const ax = $('#axis'); ax.innerHTML='';
  const bg = $('#bg'); bg.innerHTML='';
  $('#canvas').style.width = (TOTAL*state.ppd)+'px';

  MONTHS.forEach(m=>{                       // 2·4분기 음영
    if(Math.floor(m.getMonth()/3)%2!==1) return;

    const e=new Date(m.getFullYear(),m.getMonth()+3,1);
    const b=document.createElement('div'); b.className='qband';
    b.style.left=x(m)+'px'; b.style.width=(x(e)-x(m))+'px'; bg.appendChild(b);
  });
  YEARS.forEach(y=>{

    t.style.left=Math.max(0,x(new Date(y,0,1)))+'px'; t.textContent=y; ax.appendChild(t);
  });
  MONTHS.forEach(m=>{
    const left=x(m);
    const v=document.createElement('div'); v.className='vline'+(m.getMonth()===0?' strong':'');
    v.style.left=left+'px'; ax.appendChild(v);
    if(state.ppd*28 > 30){
      const l=document.createElement('div'); l.className='mo'; l.style.left=left+'px';

      ax.appendChild(l);
    }

      const v=document.createElement('div'); v.className='vline'; v.style.left=x(t)+'px'; ax.appendChild(v);
      if(state.ppd>24){

        l.textContent=t.getDate(); ax.appendChild(l);

  }
  const tl=document.createElement('div'); tl.className='today-line'; tl.style.left=x(today)+'px'; bg.appendChild(tl);
  const tf=document.createElement('div'); tf.className='today-flag'; tf.style.left=x(today)+'px';
  tf.textContent='TODAY'; ax.appendChild(tf);
}

function buildRows(L){
  const rows = $('#rows'); rows.innerHTML='';
  L.groups.forEach(g=>{
    const r=document.createElement('div'); r.className='lanerow';
    r.style.height=laneH(L.by[g.key].rows)+'px';
    MONTHS.forEach(m=>{
      const v=document.createElement('div'); v.className='vline'+(m.getMonth()===0?' strong':'');
      v.style.left=x(m)+'px'; r.appendChild(v);
    });

    const items = L.by[g.key].items;

    // 연쇄 일정 연결선 — 같은 줄에 놓인 것끼리만 잇는다
    const byChain={};
    items.forEach(p=>{const c=p.ev.chain; if(c)(byChain[c]=byChain[c]||[]).push(p);});
    Object.values(byChain).forEach(ps=>{
      ps.sort((a,b)=>a.left-b.left);
      for(let i=0;i<ps.length-1;i++){
        const a=ps[i], b=ps[i+1];
        if(a.row!==b.row) continue;
        const c=document.createElement('div'); c.className='chainline';
        c.style.left=(a.left+a.w)+'px'; c.style.width=Math.max(0,b.left-(a.left+a.w))+'px';
        c.style.top=(a.row*30+18)+'px'; r.appendChild(c);
      }
    });

    items.forEach(({ev,left,w,row,lab,group})=>{
      const col=CATS[ev.cat].color;
      if(group){                                          // 밀집 구간 묶음
        const c=document.createElement('button');
        c.className='ev cluster'+(group.every(isPast)?' past':'')
          +(group.some(o=>o.watch)?' watch':'');
        c.style.left=left+'px'; c.style.width=w+'px'; c.style.top=(row*30+7)+'px';
        c.style.borderColor=col;
        c.innerHTML=`<span class="fill" style="background:${col}"></span>`
                   +`<span class="cn">${group.length}</span>`;
        const from=group[0].start, to=group[group.length-1].start;
        c.title=`${from} ~ ${to} · ${group.length}건 — 확대하면 펼쳐집니다\n`
              + group.slice(0,6).map(o=>`· ${o.start} ${o.title}`).join('\n')
              + (group.length>6?`\n… 외 ${group.length-6}건`:'');
        c.onclick=e2=>{
          e2.stopPropagation();
          const sc=$('#scroller'), r=sc.getBoundingClientRect();
          setZoom(state.ppd*3, e2.clientX-r.left);
        };
        r.appendChild(c);
        return;
      }
      const s=parse(ev.start), e=endOf(ev), dd=dday(ev);
      const b=document.createElement('button');
      b.className='ev'+(isPast(ev)?' past':'')+(lab==='inside'?' inside':'')
        +(ev.estimated?' est':'')+(ev.watch?' watch':'')+(state.sel===ev.id?' sel':'');
      b.style.left=left+'px'; b.style.width=w+'px'; b.style.top=(row*30+7)+'px';
      b.style.borderColor=col;
      b.innerHTML = `<span class="fill" style="background:${col}"></span>`
        + (lab==='none' ? '' :
           `<span class="lbl">`
           + (dd>=0 && dd<=21 ? `<span class="dd">D-${dd}</span>` : '')
           + (ev.watch?'<span class="star">★</span>':'')
           + `<span>${ev.title}</span>`
           + flagOf(ev)
           + `</span>`);
      b.title = `${ev.org} · ${ev.title} · ${fmt(s)}${(ev.end&&ev.end!==ev.start)?' ~ '+fmt(e):''}`;
      b.onclick = e2=>{e2.stopPropagation(); openDetail(ev.id);};
      r.appendChild(b);
    });
    rows.appendChild(r);
  });
}

/* ============================================================
   5. 아젠다 뷰 — 날짜순 목록. 타임라인이 못 보여주는 밀집 구간을 받는다
   ============================================================ */
function buildAgenda(){
  const el=$('#agenda');
  const list=shown();
  if(!list.length){el.innerHTML='<div class="empty">조건에 맞는 일정이 없습니다.</div>';return;}

  const perMonth={};
  list.forEach(e=>{const k=e.start.slice(0,7); perMonth[k]=(perMonth[k]||0)+1;});

  let html='', mon='';
  list.forEach(ev=>{
    const s=parse(ev.start), dd=dday(ev), k=ev.start.slice(0,7);
    if(k!==mon){
      mon=k;
      html+=`<div class="mhead"><span>${s.getFullYear()}년 ${s.getMonth()+1}월</span>`
          + `<span>${perMonth[k]}건</span></div>`;
    }
    const cls = dd<0?'n':(dd<=7?'u':(dd<=30?'s':'n'));
    const ddTxt = isPast(ev)?'지남':(dd<0?'진행중':(dd===0?'D-DAY':'D-'+dd));
    const span = (ev.end&&ev.end!==ev.start) ? ` ~ ${pad(endOf(ev).getMonth()+1)}.${pad(endOf(ev).getDate())}` : '';
    html+=`<button class="arow${isPast(ev)?' past':''}${dd===0?' today':''}" data-id="${ev.id}">`
      + `<span class="ad">${pad(s.getMonth()+1)}.${pad(s.getDate())}<span class="wd">${WD[s.getDay()]}</span>${span}</span>`
      + `<span class="add ${cls}">${ddTxt}</span>`
      + `<span class="at">${ev.watch?'<span class="star">★</span> ':''}${ev.title}`
      + `<span class="org">${ev.org}</span>`
      + (ev.chainStep?`<span class="step">${ev.chainStep}</span>`:'')
      + flagOf(ev)
      + `</span>`
      + `<span class="ac" style="--dot:${CATS[ev.cat].color}"><span class="sw"></span>${CATS[ev.cat].label}</span>`
      + `</button>`;
  });
  el.innerHTML=html;
  el.querySelectorAll('.arow').forEach(b=>b.onclick=()=>openDetail(b.dataset.id));
}

/* ============================================================
   6. 임박 레일

function buildRail(){
  const rail=$('#rail'); rail.innerHTML='';
  const up = EVENTS.filter(e=>visible(e) && !isPast(e))
    .map(e=>({e, dd:dday(e), u:urgency(e)}))
    .sort((a,b)=>a.u-b.u || a.dd-b.dd).slice(0,20);
  if(!up.length){rail.innerHTML='<div class="empty">조건에 맞는 예정 일정이 없습니다.</div>';return;}
  let sect='';
  up.forEach(({e,dd,u})=>{
    const s = u<=7?'이번 주 안':(u<=30?'한 달 안':'그 이후');
    if(s!==sect){sect=s; const h=document.createElement('div'); h.className='sect'; h.textContent=s; rail.appendChild(h);}
    const cls = dd<0?'n':(dd<=7?'u':(dd<=30?'s':'n'));
    const d=parse(e.start);
    const b=document.createElement('button'); b.className='rcard'+(e.watch?' watch':'');
    b.innerHTML = `<span class="dd ${cls}">${dd<0?'진행중':(dd===0?'D-DAY':'D-'+dd)}</span>
      <span><span class="t">${e.title}</span>
      <span class="m">${fmt(d)}(${WD[d.getDay()]}) · ${e.org}</span></span>`;
    b.onclick=()=>{openDetail(e.id); if(state.view==='timeline') scrollTo(d);};
    rail.appendChild(b);
  });
}

/* ============================================================
   7. 상세
   ============================================================ */
function openDetail(id){
  const ev = EVENTS.find(e=>e.id===id); if(!ev) return;
  state.sel = id;
  const s=parse(ev.start), e=endOf(ev), dd=dday(ev);
  $('#dKicker').textContent = CATS[ev.cat].label;
  $('#dKicker').style.color = CATS[ev.cat].color;
  $('#dTitle').innerHTML = (ev.watch?'<span class="star">★</span> ':'') + ev.title + flagOf(ev);

  const ticks = (ev.tickers||[]).map(t=>/^\d{6}$/.test(t)
    ? `<a class="tick" href="https://finance.naver.com/item/main.naver?code=${t}" target="_blank" rel="noopener">${t}</a>`
    : `<span class="tick">${t}</span>`).join('');

  let rows = `
    <dt>일자</dt><dd>${fmt(s)}(${WD[s.getDay()]})${ev.end&&ev.end!==ev.start?` ~ ${fmt(e)}(${WD[e.getDay()]})`:''}</dd>
    <dt>D-day</dt><dd style="color:${dd>=0&&dd<=30?'var(--urgent)':'var(--ink)'}">${isPast(ev)?'지남':(dd<0?'진행중':(dd===0?'D-DAY':'D-'+dd))}</dd>
    <dt>주최</dt><dd class="kr">${ev.org}</dd>
    <dt>장소</dt><dd class="kr">${ev.place||'—'}</dd>
    <dt>관련</dt><dd>${ticks||'—'}</dd>`;

  const sibs = ev.chain ? (CHAINS[ev.chain]||[]).slice().sort((a,b)=>a.start.localeCompare(b.start)) : [];
  if(sibs.length>1){
    rows += `<dt>연쇄</dt><dd>` + sibs.map(o=>
      `<span class="tick"${o.id===ev.id?' style="border-color:var(--ink)"':''}>${o.chainStep} ${o.start.slice(5)}</span>`
    ).join('') + `</dd>`;
  }
  $('#dList').innerHTML = rows;
  $('#dNote').textContent = ev.note||'';

  // 손댄 흔적을 숨기지 않는다 — 무엇이 어떻게 바뀌었는지 보여야 값을 믿을 수 있다
  const edits=$('#dEdits');
  if(ev._orig){
    edits.hidden=false;
    const clip = v => {const t = v===null||v===undefined ? '—' : String(v);
                       return t.length>56 ? t.slice(0,56)+'…' : t;};
    edits.innerHTML = '<b>손으로 고친 일정입니다.</b><br>' + Object.entries(ev._orig).map(([k,v])=>
      `${k} <s>${clip(v)}</s> → <b>${clip(ev[k])}</b>`
    ).join('<br>') + '<br>되돌리려면 <code>--unfix ' + ev.id + '</code>';
  } else if(ev.manual){
    edits.hidden=false;
    edits.innerHTML = '<b>직접 추가한 일정입니다.</b> overrides.json 의 <code>add</code> 에 들어 있습니다.';
  } else edits.hidden=true;

  $('#dId').textContent = 'id ' + ev.id;
  const src=$('#dSrc');
  if(ev.src){src.style.display='';src.href=ev.src;}else{src.style.display='none';}
  $('#detail').classList.add('open');
  render();
}
function closeDetail(){state.sel=null;$('#detail').classList.remove('open');render();}

/* ============================================================
   8. 캘린더 내보내기 (.ics)
   ============================================================ */
function fold(line){                     // RFC 5545 — 한 줄 75옥텟
  const enc=new TextEncoder(); let out='', cur='';
  for(const ch of line){
    if(enc.encode(cur+ch).length > 73){ out += (out?'\r\n ':'') + cur; cur=ch; }
    else cur += ch;
  }
  return (out?out+'\r\n ':'') + cur;
}
function toICS(list){
  const esc = t => String(t||'').replace(/([\;,])/g,'\\$1').replace(/\r?\n/g,'\\n');
  const compact = s => s.replace(/-/g,'');
  const stamp = new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//bio-ir-timeline//KR','CALSCALE:GREGORIAN',
           'METHOD:PUBLISH','X-WR-CALNAME:투자 일정 타임라인','X-WR-TIMEZONE:Asia/Seoul'];
  list.forEach(ev=>{
    const excl=new Date(endOf(ev).getTime()+DAY);          // DTEND 는 배타적
    L.push('BEGIN:VEVENT',
      `UID:${ev.id}@bio-ir-timeline`,
      `DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${compact(ev.start)}`,
      `DTEND;VALUE=DATE:${compact(iso(excl))}`,
      `SUMMARY:${esc((ev.watch?'★ ':'')+ev.title
        + (ev.estimated?' (예상)':'') + (ev.verified===false?' (샘플)':''))}`,
      `CATEGORIES:${esc(CATS[ev.cat].label)}`);
    if(ev.place) L.push(`LOCATION:${esc(ev.place)}`);
    const desc=[ev.org, ev.note, ev.src].filter(Boolean).join('\n');
    if(desc) L.push(`DESCRIPTION:${esc(desc)}`);
    if(ev.src) L.push(`URL:${esc(ev.src)}`);
    // 확정된 내 종목 일정만 알림을 건다. 예상 일정까지 울리면 알림을 믿지 않게 된다
    if(ev.watch && !ev.estimated && ev.verified!==false)
      L.push('BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY',
             `DESCRIPTION:${esc(ev.title)}`,'END:VALARM');
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.map(fold).join('\r\n')+'\r\n';
}

/* ============================================================
   9. 상태 줄 · URL
   ============================================================ */
function buildStat(){
  const list=shown();
  const nv=EVENTS.filter(e=>e.verified!==false && !e.estimated).length;
  const ne=EVENTS.filter(e=>e.estimated).length;
  const ns=EVENTS.filter(e=>e.verified===false).length;
  const nw=EVENTS.filter(e=>e.watch).length;
  const next=EVENTS.filter(e=>visible(e)&&dday(e)>=0).sort((a,b)=>a.start.localeCompare(b.start))[0];
  const d7 =EVENTS.filter(e=>e.watch&&dday(e)>=0&&dday(e)<=7).length;
  const nd=EVENTS.filter(e=>e.edited||e.manual).length;
  const nh=EVENTS.filter(e=>e.hidden).length;
  $('#statline').innerHTML =
      `<span>보이는 일정 <b>${list.length}</b>건</span><span class="sep">|</span>`
    + `<span>확정 <b>${nv}</b> · 예상 <b>${ne}</b> · 샘플 <b>${ns}</b></span><span class="sep">|</span>`
    + (nd||nh ? `<span title="overrides.json 으로 손댄 일정">손질 <b>${nd}</b> · 숨김 <b>${nh}</b></span><span class="sep">|</span>` : '')
    + `<span>★ 내 종목 <b>${nw}</b>건 · 7일 내 <b>${d7}</b>건</span><span class="sep">|</span>`
    + `<span>다음 일정 ${next?`<b>${next.start}</b> ${next.title}`:'<b>없음</b>'}</span>`;
}

function saveHash(){
  const p=new URLSearchParams();
  if(state.view!=='timeline') p.set('v',state.view);
  if(state.group!=='cat')     p.set('g',state.group);
  if(state.q)                 p.set('q',state.q);
  if(state.watchOnly)         p.set('w','1');
  if(!state.hidePast)         p.set('p','1');
  if(state.only30)            p.set('d','1');
  if(state.cats.size!==Object.keys(CATS).length) p.set('c',[...state.cats].join(','));
  const h=p.toString();
  history.replaceState(null,'', h?'#'+h : location.pathname+location.search);
}
function loadHash(){
  if(!location.hash) return;
  const p=new URLSearchParams(location.hash.slice(1));
  if(p.get('v')==='agenda') state.view='agenda';
  if(p.get('g')==='org')    state.group='org';
  if(p.get('q'))            state.q=p.get('q');
  state.watchOnly = p.get('w')==='1';
  state.hidePast  = p.get('p')!=='1';
  state.only30    = p.get('d')==='1';
  if(p.get('c'))            state.cats=new Set(p.get('c').split(',').filter(k=>CATS[k]));
}

/* ============================================================
   10. 렌더 루프
   ============================================================ */
function render(){
  const timeline = state.view==='timeline';
  $('#board').hidden   = !timeline;
  $('#agenda').hidden  =  timeline;
  $('#zoomBox').style.display = timeline?'':'none';
  $('.rail').hidden = !timeline;
  $('.cols').style.gridTemplateColumns = timeline ? '' : 'minmax(0,1fr)';
  $('#goToday').style.display = timeline?'':'none';
  $('#hint').style.display    = timeline?'':'none';
  if(timeline){ buildAxis(); const L=layout(); buildLanes(L); buildRows(L); }
  else buildAgenda();
  buildRail(); buildStat(); saveHash();
}

function scrollTo(d, ratio=0.35){
  const sc=$('#scroller');
  sc.scrollLeft = Math.max(0, x(d) - sc.clientWidth*ratio);
}
function setZoom(ppd, anchorClientX){
  const sc=$('#scroller');
  const ax = anchorClientX==null ? sc.clientWidth/2 : anchorClientX;
  const dayAt = (sc.scrollLeft + ax)/state.ppd;
  state.ppd = Math.min(46, Math.max(0.9, ppd));
  render();
  sc.scrollLeft = dayAt*state.ppd - ax;
  $('#zRange').value = Math.round((Math.log(state.ppd/0.9)/Math.log(46/0.9))*100);
  $('#zLvl').textContent = state.ppd<2?'분기 단위':state.ppd<6?'월 단위':state.ppd<16?'주 단위':'일 단위';
}

/* ============================================================
   11. 바인딩
   ============================================================ */
loadHash();
$('#todayTxt').textContent = `${fmt(today)} ${WD[today.getDay()]}`;
if(!HAS_WATCH) $('#watchOnly').style.display='none';

function syncToggle(id, on){
  const b=$(id); b.classList.toggle('on',on); b.setAttribute('aria-pressed',on);
}
function syncSeg(id, attr, val){
  $(id).querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset[attr]===val));
}
syncToggle('#watchOnly', state.watchOnly);
syncToggle('#only30',    state.only30);
syncToggle('#hidePast',  state.hidePast);
syncSeg('#viewSeg','v',state.view);
syncSeg('#groupSeg','g',state.group);
$('#sortSel').hidden = state.group!=='org';
$('#q').value = state.q;

buildChips(); setZoom(2.6); scrollTo(today, 0.25);

$('#q').addEventListener('input', e=>{state.q=e.target.value.trim();render();});
$('#watchOnly').onclick = ()=>{state.watchOnly=!state.watchOnly;syncToggle('#watchOnly',state.watchOnly);render();};
$('#only30').onclick    = ()=>{state.only30=!state.only30;syncToggle('#only30',state.only30);render();};
$('#hidePast').onclick  = ()=>{state.hidePast=!state.hidePast;syncToggle('#hidePast',state.hidePast);render();};
$('#goToday').onclick   = ()=>scrollTo(today,0.25);
$('#zIn').onclick  = ()=>setZoom(state.ppd*1.5);
$('#zOut').onclick = ()=>setZoom(state.ppd/1.5);
$('#zRange').oninput = e=>setZoom(0.9*Math.pow(46/0.9, e.target.value/100));
$('#dClose').onclick = closeDetail;

/* 브라우저에서 고칠 수는 없다 — 서버가 없으니까.
   대신 그대로 붙여넣으면 되는 명령을 만들어 준다. */
function copyCmd(text){
  const done = ()=>{ const b=$('#detail'); b.classList.add('flash'); setTimeout(()=>b.classList.remove('flash'),400); };
  if(navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(done, ()=>prompt('복사해서 터미널에 붙여넣으세요', text));
  else prompt('복사해서 터미널에 붙여넣으세요', text);
}
const q1 = v => /[\s"']/.test(v) ? `'${String(v).replace(/'/g,"'\\''")}'` : v;
$('#dFix').onclick = ()=>{
  const ev = EVENTS.find(e=>e.id===state.sel); if(!ev) return;
  const parts = [`start=${ev.start}`];
  if(ev.end !== ev.start) parts.push(`end=${ev.end}`);
  if(ev.estimated) parts.push('estimated=false', 'src=');
  copyCmd(`python3 collect_dart.py --fix ${ev.id} ${parts.join(' ')}`);
};
$('#dHide').onclick = ()=>{
  const ev = EVENTS.find(e=>e.id===state.sel); if(!ev) return;
  copyCmd(`python3 collect_dart.py --hide ${ev.id}`);
};

$('#viewSeg').onclick = e=>{
  const b=e.target.closest('button[data-v]'); if(!b) return;
  state.view=b.dataset.v; syncSeg('#viewSeg','v',state.view); render();
};
$('#groupSeg').onclick = e=>{
  const b=e.target.closest('button[data-g]'); if(!b) return;
  state.group=b.dataset.g; syncSeg('#groupSeg','g',state.group);
  $('#sortSel').hidden = state.group!=='org'; render();
};
$('#sortSel').onchange = e=>{state.sort=e.target.value; render();};

$('#icsBtn').onclick = ()=>{
  const list=shown();
  if(!list.length){alert('내보낼 일정이 없습니다.');return;}
  const blob=new Blob([toICS(list)],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=`투자일정_${iso(today)}.ics`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};

const sc=$('#scroller');
sc.addEventListener('wheel', e=>{
  if(e.ctrlKey||e.metaKey){
    e.preventDefault();
    const r=sc.getBoundingClientRect();
    setZoom(state.ppd*(e.deltaY<0?1.12:1/1.12), e.clientX-r.left);
  }
},{passive:false});

let drag=null;
sc.addEventListener('pointerdown', e=>{
  if(e.target.closest('.ev')) return;
  drag={x:e.clientX, l:sc.scrollLeft}; sc.classList.add('drag'); sc.setPointerCapture(e.pointerId);
});
sc.addEventListener('pointermove', e=>{if(drag) sc.scrollLeft = drag.l-(e.clientX-drag.x);});
['pointerup','pointercancel'].forEach(t=>sc.addEventListener(t,()=>{drag=null;sc.classList.remove('drag');}));

document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){closeDetail();return;}
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
  if(e.key==='/' && !typing){e.preventDefault();$('#q').focus();return;}
  if(typing) return;
  const k=e.key.toLowerCase();
  if(k==='t'){ state.view='timeline'; syncSeg('#viewSeg','v','timeline'); render(); scrollTo(today,0.25); }
  else if(k==='a'){ state.view = state.view==='agenda'?'timeline':'agenda';
                    syncSeg('#viewSeg','v',state.view); render(); }
  else if(state.view==='timeline' && (e.key==='ArrowLeft'||e.key==='ArrowRight')){
    e.preventDefault();
    sc.scrollLeft += (e.key==='ArrowRight'?1:-1) * (e.shiftKey?sc.clientWidth*0.9:120);
  }
});

     <b>${ne}건 예상</b>(점선 · 근거는 상세의 비고에 적혀 있습니다),

     예상·샘플은 캘린더 내보내기에서 제목에 표시되고 알림이 붙지 않습니다.<br>
     갱신은 <code>python3 collect_dart.py --days 180 --inject index.html</code>.
     확인하지 못한 날짜는 채우지 않는 것이 이 화면의 규칙입니다.<br>

     손질은 <code>overrides.json</code> 에 남아 다시 수집해도 유지되고, <code>--unfix</code> 로 되돌아갑니다.`;
})();
